<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#332F86"/>
      <stop offset="100%" stop-color="#28236B"/>
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="-5%" r="65%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Atomic-orbital lockup, top-left -->
  <g transform="translate(80 90)">
    <g fill="none" stroke="#ffffff" stroke-width="2.2" transform="translate(40 40)">
      <ellipse rx="36" ry="14"/>
      <ellipse rx="36" ry="14" transform="rotate(60)"/>
      <ellipse rx="36" ry="14" transform="rotate(120)"/>
    </g>
    <g fill="#C9A24B" transform="translate(40 40)">
      <circle cx="36" cy="0" r="3.2"/><circle cx="-36" cy="0" r="3.2"/>
      <circle cx="18" cy="-31" r="3.2"/><circle cx="-18" cy="31" r="3.2"/>
      <circle cx="18" cy="31" r="3.2"/><circle cx="-18" cy="-31" r="3.2"/>
    </g>
    <circle cx="40" cy="40" r="18" fill="#ffffff"/>
    <text x="40" y="42" text-anchor="middle" dominant-baseline="middle"
          font-family="Arial, sans-serif" font-size="15" font-weight="700"
          fill="#332F86" letter-spacing="0.6">QLS</text>
    <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff" transform="translate(105 22)">
      <text font-size="30" letter-spacing="4" font-weight="700">QUANTUM</text>
      <text y="42" font-size="22" letter-spacing="6" font-weight="500" fill="#e6c986">LEAP SOLUTIONS</text>
    </g>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="80" y="320" font-size="74" font-weight="500">Corporate training that</text>
    <text x="80" y="405" font-size="74" font-weight="500">transforms how leaders</text>
    <text x="80" y="490" font-size="74" font-weight="500" font-style="italic" fill="#e6c986">think, decide, and lead.</text>
  </g>
  <text x="80" y="565" font-size="26" fill="#cdd6df" font-family="Inter, Arial, sans-serif">22 years · 2,000+ assignments · India &amp; international</text>
</svg>
